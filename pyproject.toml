[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soapboxslide"
authors = [
  { name="Toon Verstraelen", email="toon.verstraelen@ugent.be" },
]
description = "A 2D slide surface for computational soap box racing in physics education"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = [
    "soapbox",
    "soap box racing",
    "physics education",
    "teaching",
    "classical mechanics",
    "Lagrangian mechanics",
    "holonomic constraints",
    "equations of motion",
    "numerical integration",
    "automatic differentiation",
    "array API",
    "jax",
    "autograd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "array-api-compat>=1.12.0",
    "attrs>=24.2.0",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "matplotlib>=3.10.3",
]
dynamic = ["version"]

[project.optional-dependencies]
jax = [
    "jax>=0.7.0",
]
autograd = [
    "autograd>=1.8.0",
]
tests = [
    "array-api-strict>=2.4",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/molmod/soapboxslide"
Documentation = "https://github.com/molmod/soapboxslide#readme"
Issues = "https://github.com/molmod/soapboxslide/issues"
Source = "https://github.com/molmod/soapboxslide"
Changelog = "https://github.com/molmod/soapboxslide/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["soapboxslide"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A", "B", "BLE", "C4", "E", "EXE", "F", "I", "ICN", "ISC", "N", "NPY", "PERF", "PIE", "PL",
    "PT", "PYI", "RET", "RSE", "RUF", "SIM", "TRY", "UP", "W"
]
ignore = [
    "PLR0904",  # https://docs.astral.sh/ruff/rules/too-many-public-methods/
    "PLR0911",  # https://docs.astral.sh/ruff/rules/too-many-return-statements/
    "PLR0912",  # https://docs.astral.sh/ruff/rules/too-many-branches/
    "PLR0913",  # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "PLR0914",  # https://docs.astral.sh/ruff/rules/too-many-locals/
    "PLR0915",  # https://docs.astral.sh/ruff/rules/too-many-statements/
    "PLR0916",  # https://docs.astral.sh/ruff/rules/too-many-boolean-expressions/
    "PLR0917",  # https://docs.astral.sh/ruff/rules/too-many-positional/
    "PLR2004",  # https://docs.astral.sh/ruff/rules/magic-value-comparison/
    "PLW2901",  # https://docs.astral.sh/ruff/rules/redefined-loop-name/
    "PT011",  # https://docs.astral.sh/ruff/rules/pytest-raises-too-broad/
    "RET503",  # https://docs.astral.sh/ruff/rules/implicit-return/
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "TRY300",  # https://docs.astral.sh/ruff/rules/try-consider-else/
    "TRY301",  # https://docs.astral.sh/ruff/rules/raise-within-try/
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
