name: pytest
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work) ...
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - soapboxslide.py
      - test_soapboxslide.py
      - boxcar_blitz.toml
      - brutal_bends.toml
      - pyproject.toml
      - .github/workflows/pytest.yaml
  pull_request:
    # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - soapboxslide.py
      - test_soapboxslide.py
      - boxcar_blitz.toml
      - brutal_bends.toml
      - pyproject.toml
      - .github/workflows/pytest.yaml

# A new push to the same branch or PR cancels the outdated runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} (${{ matrix.platform.python-version }}, ${{ matrix.platform.resolution }})
    permissions:
      contents: read
    strategy:
      # Let all jobs finish, so platform-specific failures are not hidden.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform:
          # Oldest supported Python with the oldest supported direct dependencies.
          - python-version: '3.11'
            resolution: lowest-direct
          # Newest supported Python with the newest dependencies.
          - python-version: '3.14'
            resolution: highest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Use the same shell on all platforms, including Windows.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.platform.python-version }}
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python-version }}
      - name: Set up uv
        timeout-minutes: 1
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # All dependencies are available as wheels,
          # so the built-in cache of setup-uv is sufficient.
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ matrix.platform.python-version }}-${{ matrix.platform.resolution }}
      - name: Install with the test dependencies
        timeout-minutes: 3
        run: uv pip install --system --resolution ${{ matrix.platform.resolution }} -e .[tests]
      - name: Run pytest
        timeout-minutes: 5
        run: pytest -vv
